AutoName: Keramika

RepoType: git
Repo: https://github.com/wxstdo-boop/Keramika.git

Builds:
  - versionName: 1.6.106
    versionCode: 45178
    commit: 4b6678de444aac5aa756518b0d26873632d66e46
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.5
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - echo "flutter.sdk=$$flutter$$" >> android/local.properties
      - sed -i -e 's/signingConfigs.getByName("release")/signingConfigs.getByName("debug")/'
        android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
        --dart-define=KERAMIKA_NO_SELF_UPDATE=true
    ndk: 28.2.13676358

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
