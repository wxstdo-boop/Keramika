Builds:
  - versionName: 1.6.130
    versionCode: 45202
    commit: abafdba6a510156816620189b32cab789abc88ec
    timeout: 10800
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.5
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - sed -i -e '/REQUEST_INSTALL_PACKAGES/d' -e '/ENFORCE_UPDATE_OWNERSHIP/d' -e '/UPDATE_PACKAGES_WITHOUT_USER_ACTION/d' android/app/src/main/AndroidManifest.xml
      - sed -i -e 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
        -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -Dfile.encoding=UTF-8|'
        android/gradle.properties
      - sed -i -e 's|^org.gradle.workers.max=.*|org.gradle.workers.max=4|' android/gradle.properties
      - sed -i -e 's|^kotlin.daemon.jvmargs=.*|kotlin.daemon.jvmargs=-Xmx1g|' android/gradle.properties
      - echo "flutter.sdk=$$flutter$$" >> android/local.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=KERAMIKA_NO_SELF_UPDATE=true
    ndk: 28.2.13676358

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+\+[0-9]+$
