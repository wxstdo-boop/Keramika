name: ship

# Автозапуск релиза по пушу в main.
#
# Здесь ТОЛЬКО две вещи: поднять версию и позвать общий процесс сборки
# `.github/workflows/release.yml`. Сборка, проверки, подпись и публикация
# живут в одном месте — иначе два релиз-процесса рано или поздно разъезжаются
# (так и вышло: тег-сборка не проверяла lockfile, не гоняла тесты и брала
# плавающий SDK).
#
# Триггеры:
#   1. Push в main (когда изменились lib/, android/, test/, ios/, web/, ship.yml
#      сам). Автоматически поднимает patch-версию и публикует GitHub Release.
#   2. Ручной запуск (workflow_dispatch) — выбор bump (patch/minor/none),
#      заметки и dry_run.
#
# Защита от рекурсии:
#   — paths-фильтр: триггер реагирует только на изменения в исходниках
#     и на ship.yml сам (не на pubspec.yaml / pubspec.lock — они меняются
#     в коммите «release: v…» и не должны перезапускать воркфлоу).
#   — if: на job: пропускает, если коммит начинается с «release:»
#     (это коммит, который сам ship делает для бампа версии).
#
# Результат: пуш кода → auto-release → UpdateService в приложении видит
# releases/latest → показывает UpdatePill → пользователь обновляет.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Тип бампа версии'
        type: choice
        options:
          - patch
          - minor
          - none
        default: patch
      notes:
        description: 'Заметки к релизу (пусто = GitHub сгенерирует сам)'
        required: false
        default: ''
      dry_run:
        description: 'Только сборка, без коммита и релиза'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'ios/**'
      - 'web/**'
      - '.github/workflows/ship.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  bump:
    # Пропускаем триггер на push, если коммит начинается с «release:»
    # (это бамп, который сам ship сделал — не нужен рекурсивный запуск).
    # Для workflow_dispatch (ручной) условие всегда true.
    if: >
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Бамп версии
        id: ver
        run: |
          set -euo pipefail
          CUR=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME=${CUR%%+*}
          CODE=${CUR##*+}
          MAJOR=${NAME%%.*}
          REST=${NAME#*.}
          MINOR=${REST%%.*}
          PATCH=${REST##*.}
          # При push-триггере inputs.bump пуст — дефолт patch.
          BUMP="${{ inputs.bump }}"
          [ -z "$BUMP" ] && BUMP="patch"
          case "$BUMP" in
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            none)  ;;
            *) echo "Неизвестный bump: $BUMP"; exit 1 ;;
          esac
          NAME="$MAJOR.$MINOR.$PATCH"
          CODE=$((CODE + 1))
          TAG="v${NAME}+${CODE}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Тег ${TAG} уже существует в истории — не буду переиспользовать"
            exit 1
          fi
          sed -i "s/^version: .*/version: ${NAME}+${CODE}/" pubspec.yaml
          # `kAppVersion` в lib/services/app_version.dart обязан совпадать с
          # versionName из pubspec.yaml — иначе регрессионный тест
          # app_version_test.dart роняет сборку релизa, а пользователь в
          # «О приложении» видит версию прошлого релиза. Бамп обновляет
          # и pubspec.yaml, и эту константу — иначе первый же авторелиз
          # после этого коммита был бы красным.
          if [ -f lib/services/app_version.dart ]; then
            sed -i -E "s/^const String kAppVersion = '[^']*';/const String kAppVersion = '${NAME}';/" lib/services/app_version.dart
            grep -n "kAppVersion" lib/services/app_version.dart
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Собираем ${TAG}"

      - name: Коммит версии
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "keramika-ship"
          git config user.email "ship@users.noreply.github.com"
          # kAppVersion обновляется бампом вместе с pubspec.yaml — иначе
          # следующий же регрессионный тест упадёт на расхождении версий.
          git add pubspec.yaml pubspec.lock lib/services/app_version.dart
          git commit -m "release: ${{ steps.ver.outputs.tag }}"
          # Только main: бамп не задевает forge и другие ветки.
          # Пуш в main не перезапустит воркфлоу: коммит "release: v…" отсекается
          # условием job (сообщение начинается с "release:"), даже если он
          # задевает lib/ — paths-фильтр тут не единственная защита.
          git push origin "HEAD:${GITHUB_REF_NAME}"

  publish:
    # Сборка и публикация — общий процесс, тот же, что и по тегу.
    needs: bump
    runs-on: ubuntu-latest
    uses: ./.github/workflows/release.yml
    with:
      version_name: ${{ needs.bump.outputs.name }}
      version_code: ${{ needs.bump.outputs.code }}
      tag: ${{ needs.bump.outputs.tag }}
      notes: ${{ inputs.notes }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
