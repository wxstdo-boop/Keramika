name: ci

# Анализ и тесты на каждый push/PR — чтобы синтаксические и логические
# регрессии (типа сломанной скобки, вылезшей в релиз) не доезжали до тега.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Анализ (warnings и info = провал)
        run: flutter analyze --fatal-infos

      - name: Тесты
        run: flutter test --no-pub
