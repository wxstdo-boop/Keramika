name: release-watchdog

# Страховка релизной цепочки: сборка релиза могла зависнуть/упасть,
# GitHub сам запуск не повторит, и автообновление в приложении молча
# не получает новый releases/latest (сегодняship провис ~3 часа, и
# только повторный пуш вытянул релиз).
#
# Каждые 30 минут сравниваем версию main с releases/latest:
#   * main новее последних релиза  И нет активного ship/release-прогона
#     → запускаем ТОТ ЖЕ release.yml (общий путь сборки), который
#     вызывают ship и release-on-tag. Код трогать не пробуем — только
#     догоняем опоздавший релиз.
#
# `permissions: contents: write` обязателен: вызываемый release.yml
# получает наш GITHUB_TOKEN, и без write права softprops/action-gh-release
# не создаст релиз. `actions: read` — чтобы видеть чужие активные прогоны
# и не заваливать их дублем.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Публиковать релиз даже если main == latest'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.cmp.outputs.missing }}
      name: ${{ steps.cmp.outputs.name }}
      code: ${{ steps.cmp.outputs.code }}
      tag: ${{ steps.cmp.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Сравнить main и releases/latest
        id: cmp
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          CUR=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME=${CUR%%+*}
          CODE=${CUR##*+}

          LATEST_JSON=$(curl -sf "https://api.github.com/repos/$REPO/releases/latest" || echo '{}')
          LTAG=$(printf '%s' "$LATEST_JSON" | jq -r '.tag_name // empty')
          # Из тега «v1.6.76+45148» достаём versionCode: последнее число.
          LCODE=$(printf '%s' "$LTAG" | grep -oE '[0-9]+$' || echo 0)

          # Чужой прогон сборки уже гоняет (ship завис/упал, но висит)?
          # Тогда НЕ запускаем второй — дождёмся следующего цикла.
          # `grep -c` печатает «0» и сам по себе рвёт pipeline (exit 1) —
          # глушим через `|| true` и нормализуем пустое значение.
          ACTIVE=$(
            curl -sf "https://api.github.com/repos/$REPO/actions/runs?status=active&per_page=50" \
              | jq -r '.workflow_runs[].name // empty' 2>/dev/null \
              | grep -cE 'ship|release' || true
          )
          ACTIVE=${ACTIVE:-0}

          FORCE="${{ inputs.force || 'false' }}"

          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::warning::Не удалось разобрать версию main — пропускаю цикл."
            echo "missing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CODE" -le "$LCODE" ] && [ "$FORCE" = "false" ]; then
            echo "main=$NAME+$CODE не новее lastRelease=${LTAG:-нет} — всё на месте."
            echo "missing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ACTIVE" -gt 0 ] && [ "$FORCE" = "false" ]; then
            echo "::notice::Опоздание на ${NAME}+${CODE}, но активен чужой ship/release-прогон (${ACTIVE}) — догоним в следующем цикле."
            echo "missing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Publishing missed release ${NAME}+${CODE} (latest: ${LTAG:-нет}, active builds: ${ACTIVE})."
          echo "missing=true" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}+${CODE}" >> "$GITHUB_OUTPUT"

  publish:
    # `runs-on` здесь НЕЛЬЗЯ: job, который вызывает reusable workflow
    # через `uses:`, не может задавать раннер — его выбирает вызываемый
    # workflow. С `runs-on` GitHub не разбирает файл целиком: прогон
    # падает за секунду с нулём job'ов (та же грабли, что в ship.yml).
    needs: check
    if: needs.check.missing == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version_name: ${{ needs.check.name }}
      version_code: ${{ needs.check.code }}
      tag: ${{ needs.check.tag }}
      notes: 'Автодогон релиза (release-watchdog): сборка основного прогона зависла или не успела опубликоваться.'
      dry_run: 'false'
    secrets: inherit
