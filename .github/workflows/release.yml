name: release

# Сборка и публикация релиза по тегу вида v1.6.46+37120
# (versionName+versionCode — как в pubspec.yaml). Ассеты переименовываются
# в Keramika-<version>-<abi>.apk, чтобы приложение могло выбрать свой ABI.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Восстановить keystore из секретов
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - run: flutter pub get

      - run: flutter build apk --release --split-per-abi

      - name: Переименовать APK с версией
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          cd build/app/outputs/flutter-apk
          for f in *-release.apk; do
            abi="${f%-release.apk}"
            mv "$f" "Keramika-${VERSION}-${abi}.apk"
          done
          ls -la

      - name: Вычислить SHA-256 для APK
        id: hashes
        run: |
          {
            echo "## SHA-256 суммы"
            echo ""
            echo "Ассеты проверяются по SHA-256 при автообновлении."
            echo ""
            echo "| Файл | SHA-256 |"
            echo "|------|---------|"
            for f in build/app/outputs/flutter-apk/*.apk; do
              sha=$(sha256sum "$f" | awk '{print $1}')
              echo "| $(basename "$f") | `$sha` |"
            done
          } > hashes.md
          {
            echo "body<<EOF"
            cat hashes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          body: ${{ steps.hashes.outputs.body }}
          generate_release_notes: false
