name: Apply splash perf patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout perf branch
        uses: actions/checkout@v4
        with:
          ref: perf/whole-app-opt
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply patch and push
        run: |
          set -e
          if git apply --check docs/patches/splash_perf.patch; then
            git apply docs/patches/splash_perf.patch
          else
            echo "Patch already applied or conflict"
            git apply --3way docs/patches/splash_perf.patch || true
          fi
          git config user.name "perf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/splash_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "perf(splash): cache splat paths, skip idle shine frames, medium filter"
          git push origin HEAD:perf/whole-app-opt
