name: Apply splash perf patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/whole-app-opt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: |
          git apply docs/patches/splash_perf.patch
          git config user.name "perf-bot"
          git config user.email "perf-bot@users.noreply.github.com"
          git add lib/screens/splash_screen.dart
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "perf(splash): cache splat paths, skip idle shine frames, medium filter"
          git push origin perf/whole-app-opt
