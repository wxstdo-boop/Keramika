name: Apply perf patches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout perf branch
        uses: actions/checkout@v4
        with:
          ref: perf/whole-app-opt
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply patches and push
        run: |
          set -e
          git config user.name "perf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          apply_one() {
            local patch="$1"
            if [ ! -f "$patch" ]; then
              echo "Missing $patch"
              return 0
            fi
            if git apply --check "$patch" 2>/dev/null; then
              git apply "$patch"
              echo "Applied $patch"
            else
              echo "Skip or conflict: $patch"
              git apply --3way "$patch" || true
            fi
          }

          apply_one docs/patches/splash_perf.patch
          apply_one docs/patches/lock_perf.patch

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "perf: apply splash + lock patches (AmbientVsync, splat cache)"
          git push origin HEAD:perf/whole-app-opt
