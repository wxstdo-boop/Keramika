# Настройки анализатора.
#
# Зачем здесь только exclude: в `worktrees/` Pane держит рабочие копии проекта
# (отдельный чекаут на фичу/PR), и `flutter analyze` обходит их как обычный код.
# Прогон по корню из-за этого шёл 78 с и выдал 8 замечаний из чужого
# `third_party/flutter_overlay_window` внутри воркдерепа — при нуле замечаний по
# `lib/` и `test/`. Проверяем только сам проект.
analyzer:
  exclude:
    - worktrees/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
