name: keramika
description: "FOSS alarm clock with tasks — Material You design."
publish_to: 'none'
# versionCode должен быть строго ВЫШЕ установленного на телефоне, иначе
# `adb install -r` падает с INSTALL_FAILED_VERSION_DOWNGRADE. У split-APK
# Flutter прибавляет к номеру из pubspec индекс ABI (v7a +1000, arm64 +2000),
# т.е. 45123 здесь → 47123 в app-arm64-v8a-release.apk. Установлена версия
# 1.6.50 (код 47122), поэтому следующий номер базы должен быть 45123 и выше.
# Обновление ставится поверх старого с сохранением данных (PIN, будильники).
version: 1.6.51+45123

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # Набор версий подобран под Flutter 3.47 / Dart 3.12. Связка
  # file_picker 13 + share_plus 13 — единственная, которая резолвится
  # вместе: share_plus 13 тянет win32 ^6, file_picker 13 — win32 ^6 тоже.
  # Возврат file_picker к ^10 ломает solve, а удаление share_plus (он нигде
  # не импортируется) откатывает file_picker и flutter_local_notifications
  # на старыеmajor-версии и ломает компиляцию. Не откатывать без нужды.
  dynamic_color: ^1.9.0
  characters: ^1.4.1
  cryptography: ^2.7.0
  flutter_secure_storage: 11.2.0
  shared_preferences: ^2.5.0
  uuid: ^4.5.1
  audioplayers: ^6.1.0
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  url_launcher: ^6.3.1
  android_intent_plus: ^6.1.0

  path_provider: ^2.1.0
  # Локальный форк: регистрирует плагины в оверлейном движке
  # (иначе в мини-окошке нет prefs/path_provider — история пустая,
  # ИИ не отвечает) и убирает текст уведомления.
  flutter_overlay_window:
    path: third_party/flutter_overlay_window
  # Локальный форк: pub-версия 6.0.0 компилирует android-библиотеку с
  # compileSdk 31 и падает на AAR-метаданных (androidx требует 33+).
  # Сконвертировали форк с compileSdk 36.
  flutter_keyboard_visibility:
    path: third_party/flutter_keyboard_visibility
  http: ^1.2.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/keramika.png
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-400.ttf
          weight: 400
        - asset: assets/fonts/Caveat-500.ttf
          weight: 500
        - asset: assets/fonts/Caveat-600.ttf
          weight: 600
        - asset: assets/fonts/Caveat-700.ttf
          weight: 700
    # Roboto с широким em dash — для тире в режиме Caveat (см. WideDashController).
    # Бандлим его: fontFamily 'Roboto' НЕ бандлится и на устройстве не
    # резолвится, из-за чего глиф тире падал обратно в Caveat и оставался узким.
    - family: RobotoDash
      fonts:
        - asset: assets/fonts/RobotoDash-400.ttf
          weight: 400
        - asset: assets/fonts/RobotoDash-700.ttf
          weight: 700