# Tuned for ~8 GB RAM — do NOT use -Xmx4G/-Xmx8G (freezes the PC).
# Free RAM was ~470 MB at build time (browsers + IDE eating the rest), so the
# Gradle daemon heap is kept low; the OS pages the rest. OOM was observed at
# -Xmx2048m on this machine.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
# 4 воркера: R8 и dexing распараллеливаются (нужно >=4 ядер CPU).
# НО при дефиците ОЗУ один воркер дешевле: меньше параллельной нагрузки на
# кучу и страничный файл.
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx384m
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
# Инкрементальная компиляция Kotlin ломается, когда проект собирается с
# виртуального диска K: (subst на путь с кириллицей), а pub-кэш плагинов
# лежит на C: — разные корни дисков, относительные пути не строятся
# («this and base files have different roots»). Отключаем: сборка чуть
# дольше, зато стабильная на любом пути.
kotlin.incremental=false
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=true
# Не даём Flutter-плагину подключать сломанный getDefaultProguardFile()
# (AGP 9.0.1 отдаёт несуществующий путь), R8 включаем сами в build.gradle.kts.
shrink=false
android.overridePathCheck=true
# Прокси 127.0.0.1:10808 временно отключён — сервер не поднят, Gradle из-за
# него не мог скачать плагины (kotlin-dsl / kotlin.jvm). IPv4 форсируется
# через GRADLE_OPTS=-Djava.net.preferIPv4Stack=true (IPv6-маршрут отсутствует).
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=10808
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=10808
