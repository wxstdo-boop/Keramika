# Tuned for ~8 GB RAM — do NOT use -Xmx4G/-Xmx8G (freezes the PC).
# 2G — компромисс: R8 на 1.5G молотит с GC-паузами.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
# 4 воркера: R8 и dexing распараллеливаются (нужно >=4 ядер CPU).
org.gradle.workers.max=2
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
kotlin.daemon.jvmargs=-Xmx512m
kotlin.incremental=true
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Не даём Flutter-плагину подключать сломанный getDefaultProguardFile()
# (AGP 9.0.1 отдаёт несуществующий путь), R8 включаем сами в build.gradle.kts.
shrink=false
android.overridePathCheck=true
